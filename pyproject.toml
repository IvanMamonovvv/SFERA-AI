[project]
name = "sfera-ai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Vladislav Proskurkin", email = "proskurkin-va@zvuk.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13",
    "apscheduler>=3.11.3",
    "boto3>=1.43.81",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.5",
    "pypdf>=6.16.2",
    "python-docx>=1.2.0",
    "reportlab>=5.0.1",
    "sqlalchemy>=2.0",
    "uvicorn[standard]>=0.52.4",
]

[project.scripts]
sfera-ai = "sfera_ai:main"

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
